name: Déploiement GitHub Pages

on:
  push:
    # `main` est la cible demandée ; la branche de développement est également
    # listée car c'est elle qui est actuellement la branche par défaut du dépôt,
    # et l'environnement `github-pages` n'autorise que la branche par défaut.
    branches: [main, claude/loup-garou-web-app-kv4rk6]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build (Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Active GitHub Pages (source « GitHub Actions ») si ce n'est pas déjà fait.
          enablement: true

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'application
        run: npm run build

      - name: Téléverser l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Déploiement
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
